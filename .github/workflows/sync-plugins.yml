name: Sync Plugin Docs

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # ── Job 1: Parse catalog → matrix ──
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse catalog.yaml
        id: parse
        run: |
          MATRIX=$(yq -o=json '.plugins[] | select(.visible == true)' \
            src/data/plugins/catalog.yaml | jq -sc '.')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ── Job 2: 1 job per plugin, in parallel ──
  process-plugin:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch README
        env:
          PLUGIN_SOURCE: ${{ matrix.plugin.source }}
        run: |
          TYPE="${PLUGIN_SOURCE%%:*}"
          REF="${PLUGIN_SOURCE#*:}"

          case "$TYPE" in
            github)
              RAW_URL="https://raw.githubusercontent.com/$(echo "$REF" | \
                sed 's|/tree/|/|')/README.md"
              curl -sf "$RAW_URL" > readme.md || echo "" > readme.md
              ;;
            npm)
              ENCODED=$(echo "$REF" | sed 's|/|%2F|g')
              curl -sf "https://registry.npmjs.org/$ENCODED" | \
                jq -r '.readme // ""' > readme.md
              ;;
            oci)
              REGISTRY="${REF%%/*}"
              IMAGE="${REF#*/}"
              MANIFEST=$(curl -sf -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                "https://$REGISTRY/v2/$IMAGE/manifests/latest" 2>/dev/null || \
                curl -sf -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                "https://$REGISTRY/v2/$IMAGE/manifests/$(curl -sf "https://$REGISTRY/v2/$IMAGE/tags/list" | jq -r '.tags[0]')" 2>/dev/null)
              if [ -n "$MANIFEST" ]; then
                LAYER=$(echo "$MANIFEST" | jq -r '.layers[0].digest')
                curl -sfL "https://$REGISTRY/v2/$IMAGE/blobs/$LAYER" | \
                  tar -xzf - --wildcards "*/README.md" -O > readme.md 2>/dev/null || echo "" > readme.md
              else
                echo "" > readme.md
              fi
              ;;
          esac

      - name: Prepare context
        env:
          PLUGIN_ID: ${{ matrix.plugin.id }}
        run: |
          if [ -f src/data/plugins/plugins.json ]; then
            jq -r --arg id "$PLUGIN_ID" '.en[] | select(.id == $id) | .desc // ""' \
              src/data/plugins/plugins.json > existing-en.txt 2>/dev/null || echo "" > existing-en.txt
            jq -r --arg id "$PLUGIN_ID" '.pt[] | select(.id == $id) | .desc // ""' \
              src/data/plugins/plugins.json > existing-pt.txt 2>/dev/null || echo "" > existing-pt.txt
          else
            echo "" > existing-en.txt
            echo "" > existing-pt.txt
          fi

      - name: Generate description
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          claude_args: "--model claude-sonnet-4-6 --allowedTools Read,Write"
          prompt: |
            You are a technical copywriter for the VeeCode Platform developer portal
            (platform.vee.codes). Plugin descriptions appear on the catalog page at
            /resources/ — they are the first text a potential customer reads when
            evaluating Backstage plugins to adopt.

            ## Input

            Read these files:
            - readme.md — the plugin's README documentation
            - existing-en.txt — current English description on the site (may be empty)
            - existing-pt.txt — current Brazilian Portuguese description (may be empty)

            ## Step 1: Evaluate Existing Descriptions

            If existing descriptions are non-empty, compare them against the README.

            PRESERVE the existing descriptions UNCHANGED if they:
            - Accurately describe the plugin's core functionality
            - Mention specific features documented in the README
            - Are concise (1-2 sentences) and well-written

            Only UPDATE if one of these conditions is true:
            - The existing description says "No description available." or is empty
            - The existing description contains factual inaccuracies
            - The README documents significant new capabilities completely absent
              from the existing description

            All other cases are cases to PRESERVE — including when the only
            possible changes would be synonym swaps ("view" ↔ "see"), stylistic
            rewording ("all from within" ↔ "directly from"), or structural
            changes that carry the same information.

            ## Step 2: Write Descriptions (only if update is needed or new plugin)

            Quality criteria:
            1. 1-2 sentences, concise but specific
            2. Mention CONCRETE capabilities (e.g., "trigger pipelines, view logs,
               cancel jobs" — the more specific, the better)
            3. User perspective: what can I DO with this plugin?
            4. Professional marketing tone — clear, compelling
            5. Specificity over brevity — always preserve specific feature mentions
            6. PT-BR must be a natural, fluent translation

            ## Examples

            GOOD (specific, feature-rich):
            EN: "A Backstage frontend plugin that lets you manage Kong Gateway
            services, routes, and plugins directly from your software catalog.
            You can view service details, configure plugins, and create or edit
            routes — all without leaving Backstage."
            PT: "Um plugin frontend para o Backstage que permite gerenciar serviços,
            rotas e plugins do Kong Gateway diretamente pelo catálogo de software.
            Você pode visualizar detalhes dos serviços, configurar plugins e criar
            ou editar rotas — tudo sem sair do Backstage."

            Weaker alternative (for comparison):
            EN: "A Backstage frontend plugin that lets you manage Kong Gateway
            services, routes, and plugins directly from your software catalog
            entity pages."
            → The first version is stronger because it lists specific capabilities
            (view details, configure plugins, create/edit routes). Always prefer
            the version with more concrete features.

            ## Step 3: Verify Before Writing

            Before writing the output files, verify:
            - If preserving: the text is exactly as-is from existing-en/pt.txt
            - If updating: the new description mentions at least as many specific
              features as the existing one, plus any new capabilities
            - The PT-BR version reads naturally and fluently

            ## Output

            Write two files:
            1. description-en.txt — English description only (plain text, no quotes,
               no markdown, no labels)
            2. description-pt.txt — Brazilian Portuguese (pt-BR) description only

            If preserving existing descriptions, write them exactly as-is.
            If readme.md is empty and no existing description exists,
            write "No description available." in both files.

      - name: Build artifact
        env:
          PLUGIN_SOURCE: ${{ matrix.plugin.source }}
          PLUGIN_ID: ${{ matrix.plugin.id }}
          PLUGIN_TITLE: ${{ matrix.plugin.title }}
          PLUGIN_PATH: ${{ matrix.plugin.path }}
          PLUGIN_IMAGE: ${{ matrix.plugin.image }}
          PLUGIN_NPM: ${{ matrix.plugin.npm }}
          PLUGIN_TAGS: ${{ toJson(matrix.plugin.tags) }}
        run: |
          DESC_EN=$(cat description-en.txt 2>/dev/null || echo "No description available.")
          DESC_PT=$(cat description-pt.txt 2>/dev/null || echo "No description available.")
          SOURCE_TYPE="${PLUGIN_SOURCE%%:*}"

          if [ "$SOURCE_TYPE" != "github" ] && [ -s readme.md ]; then
            cp readme.md readme-cache.md
          fi

          if [ "$SOURCE_TYPE" = "github" ]; then
            REF="${PLUGIN_SOURCE#github:}"
            URL="https://github.com/$REF"
          else
            URL=""
          fi

          jq -n \
            --arg id "$PLUGIN_ID" \
            --arg title "$PLUGIN_TITLE" \
            --arg path "$PLUGIN_PATH" \
            --arg image "$PLUGIN_IMAGE" \
            --arg url "$URL" \
            --arg desc_en "$DESC_EN" \
            --arg desc_pt "$DESC_PT" \
            --arg npm "$PLUGIN_NPM" \
            --argjson tags "$PLUGIN_TAGS" \
            '{id:$id,title:$title,path:$path,image:$image,
              url:$url,desc_en:$desc_en,desc_pt:$desc_pt,npm:$npm,
              tags:$tags}' \
            > plugin-data.json

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.plugin.id }}
          path: |
            plugin-data.json
            readme-cache.md

  # ── Job 3: Merge → plugins.json + locales + readmes → PR ──
  merge:
    needs: process-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: plugin-*

      - name: Generate plugins.json and patch locales
        run: |
          PLUGINS=$(find artifacts/ -name 'plugin-data.json' -exec cat {} \; | jq -s '.')

          echo "$PLUGINS" | jq '{
            en: [.[] | {id: .id, image: .image, title: .title,
                        path: .path, tags: .tags, desc: .desc_en, url: .url}],
            pt: [.[] | {id: .id, image: .image, title: .title,
                        path: .path, tags: .tags, desc: .desc_pt, url: .url}]
          }' > src/data/plugins/plugins.json

          echo "$PLUGINS" | jq -c '.[]' | while IFS= read -r row; do
            ID=$(echo "$row" | jq -r '.id')
            DESC_EN=$(echo "$row" | jq -r '.desc_en')
            DESC_PT=$(echo "$row" | jq -r '.desc_pt')
            jq --arg id "$ID" --arg desc "$DESC_EN" \
              '.resources[$id] = {description: $desc}' \
              locales/en.json > tmp.json && mv tmp.json locales/en.json
            jq --arg id "$ID" --arg desc "$DESC_PT" \
              '.resources[$id] = {description: $desc}' \
              locales/pt.json > tmp.json && mv tmp.json locales/pt.json
          done

          mkdir -p src/data/plugins/readmes
          for dir in artifacts/plugin-*/; do
            if [ -f "$dir/readme-cache.md" ]; then
              ID=$(jq -r '.id' "$dir/plugin-data.json")
              cp "$dir/readme-cache.md" "src/data/plugins/readmes/$ID.md"
            fi
          done

          rm -rf artifacts/

      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-plugin-docs
          delete-branch: true
          title: 'chore: sync plugin documentation'
          body: |
            Automated plugin docs sync via claude-code-action matrix.
            Each plugin README processed in parallel.
          commit-message: 'chore: sync plugin docs from READMEs'
          base: develop
          labels: automated,documentation
